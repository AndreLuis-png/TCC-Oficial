<head>
    <meta charset="UTF-8">
    <title>Tabela</title>

    <style>
        :root {
            --primary-blue: #192A6B;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--primary-blue) url('../../static/home.png') center/cover no-repeat;
            font-family: Arial, sans-serif;
        }

        table {
            position: absolute;

            /* POSIÇÃO DA TABELA */
            left: 20%;
            top: 30%;

            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px 20px;
        }
    </style>
</head>

<body>
