<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='çennay.png') }}">    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SENAI Almoxarifado</title>
    <style>
        :root {
            --primary-blue: #192A6B;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--primary-blue) url("{{ url_for('static', filename='Almoxarifado.png') }}") center/cover no-repeat;
            font-family: Arial, sans-serif;
        }

        .login-box {
            position: absolute;
            top: 49%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 510px;
            height: 285px;
            background: white;
            border-radius: 30px;
            padding: 20px 0;
        }

        .login-box h1 {
            margin: 0 0 15px;
            text-align: center;
            color: #f28c00;
            font-size: 60px;
            text-shadow: 3px 3px #000;
        }

        .campo {
            margin-left: 60px;
            margin-bottom: 10px;
        }

        .campo label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .campo input {
            width: 390px;
            height: 32px;
            padding: 0 12px;
            border: 2px solid #000;
            border-radius: 20px;
            box-sizing: border-box;
        }

        .botao-entrar {
            display: block;
            width: 150px;
            margin: 14px auto 0;
            padding: 10px 0;
            background: #192A6B;
            color: white;
            text-align: center;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <form class="login-box" method="POST" action="{{ url_for('login_bp.login') }}">
        <h1>Login</h1>

        <div class="campo">
            <label for="usuario">Usuário:</label>
            <input type="text" id="usuario" name="usuario" required>
        </div>

        <div class="campo">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
        </div>

        <button type="submit" class="botao-entrar">Entrar</button>
    </form>

</body>
</html>
