<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>

   <style>
        :root {
            --primary-blue: #192A6B;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 1920px;
            height: 1080px;
            overflow: hidden;

            background: var(--primary-blue) url('../../static/pag admin.png')
                        top left / 1920px 1080px no-repeat;

            font-family: Arial, sans-serif;
            position: relative;
        }

        /* PESQUISA */
        .caixa-pesquisa {
            position: absolute;
            left: 1270px;
            top: 484px;

            width: 545px;
            height: 34px;

            padding: 0 22px;
            border: none;
            border-radius: 30px;
            outline: none;

            background: #ffffff;
            font-size: 18px;
        }

        /* PESQUISA */
        .caixa-pesquisa2 {
            position: absolute;
            left: 49px;
            top: 495px;

            width: 545px;
            height: 34px;

            padding: 0 22px;
            border: none;
            border-radius: 30px;
            outline: none;

            background: #ffffff;
            font-size: 18px;
        }
    </style> 
</head>

<body>

    <input
        type="text"
        class="caixa-pesquisa"
        placeholder="Pesquise"
    >
 
    <input
        type="text"
        class="caixa-pesquisa2"
        placeholder="Pesquise"
    >

</body>

</html>
