<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>

   <style>
        :root {
            --primary-blue: #192A6B;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 1920px;
            height: 1080px;
            overflow: hidden;

            background: var(--primary-blue) url('../../static/pag admin.png')
                        top left / 1920px 1080px no-repeat;

            font-family: Arial, sans-serif;
            position: relative;
        }

        /* PESQUISA */
        .caixa-pesquisa {
            position: absolute;
            left: 623px;
            top: 215px;

            width: 675px;
            height: 59px;

            padding: 0 22px;
            border: none;
            border-radius: 30px;
            outline: none;

            background: #E5E5E5;
            font-size: 18px;
        }

        /* BOTÕES */
        .botoes {
            position: absolute;
            left: 1140px;
            top: 300px;

            display: flex;
            gap: 10px;
        }

        .botao {
            width: 194px;
            height: 70px;

            border: none;
            border-radius: 18px;
            background: transparent;

            color: white;
            font-size: 16px;
            font-weight: bold;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            cursor: pointer;
        }

        .botao span {
            font-size: 23px;
        }

        /* TABELA 
        .tabela-area {
            position: absolute;
            left: 10%;
            top: 39%;
            width: 80%;
            height: 58vh;
        }

        .tabela-scroll {
            width: 100%;
            height: 99%;
            overflow: auto;

            border: 2px solid black;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        th,
        td {
            border: 2px solid black;
            padding: 20px 65px;
            white-space: nowrap;
            text-align: center;
        }

        td {
            font-size: 18px;
        }

        th {
            position: sticky;
            top: 0;
            z-index: 10;

            background: #FF9500;
            font-size: 16px;
        }*/
    </style> 
</head>

<body>

    <!-- PESQUISA -->
    <input
        type="text"
        class="caixa-pesquisa"
        placeholder="Pesquise"
    >

    <!-- BOTÕES -->
    <div class="botoes">

        <button class="botao">
            <span>🔧</span> Uso Geral
        </button>

        <button class="botao">
            <span>⚙️</span> Mecânica
        </button>

        <button class="botao">
            <span>⚡</span> Elétrica
        </button>

    </div>

    <!-- TABELA -->
    <div class="tabela-area">

        <div class="tabela-scroll">

            <table>

                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Produto</th>
                        <th>Área de Uso</th>
                        <th>Quantidade</th>
                        <th>Preço</th>
                        <th>Descrição</th>
                        <th>Imagem</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <td>1</td>
                        <td>Produto 1</td>
                        <td>Curitiba</td>
                        <td>1</td>
                        <td>R$ 10,00</td>
                        <td>Produto exemplo</td>
                        <td>Imagem</td>
                    </tr>

                    <tr>
                        <td>8</td>
                        <td>Produto 8</td>
                        <td>São Paulo</td>
                        <td>2</td>
                        <td>R$ 20,00</td>
                        <td>Produto exemplo</td>
                        <td>Imagem</td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</body>

</html>
