<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Runner - Power-ups</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #080b10;
      color: #00f3ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .game-wrapper { position: relative; width: 100%; max-width: 800px; padding: 10px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .title { font-size: 1.5rem; font-weight: 800; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0, 243, 255, 0.6); }
    .score-board { font-family: monospace; font-size: 1.2rem; color: #f43f5e; background: #111827; padding: 6px 16px; border-radius: 8px; border: 1px solid #1f2937; }
    .score-board span { color: #00f3ff; margin-left: 10px; }
    canvas { width: 100%; height: auto; background: #0f172a; border: 2px solid #00f3ff; border-radius: 12px; box-shadow: 0 0 20px rgba(0, 243, 255, 0.2); display: block; }
    .overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 23, 42, 0.95); border: 2px solid #00f3ff; backdrop-filter: blur(8px); padding: 30px; border-radius: 16px; text-align: center; box-shadow: 0 0 30px rgba(0, 243, 255, 0.4); width: 85%; max-width: 420px; z-index: 10; }
    .overlay h2 { font-size: 2rem; margin-bottom: 10px; color: #f43f5e; }
    .overlay p { color: #94a3b8; margin-bottom: 20px; font-size: 0.95rem; }
    .btn { background: #00f3ff; color: #080b10; border: none; padding: 12px 28px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; transition: all 0.2s; }
    .btn:hover { transform: scale(1.05); background: #38bdf8; }
    .status-bar { display: flex; gap: 10px; margin-top: 8px; font-size: 0.85rem; font-weight: bold; height: 20px; }
    .status-tag { padding: 2px 8px; border-radius: 4px; display: none; }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <div class="header">
      <div class="title">⚡ CYBER RUNNER</div>
      <div class="score-board">HI <span id="hiScoreText">00000</span> | <span id="scoreText">00000</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="300"></canvas>

    <div class="status-bar">
      <div id="tagShield" class="status-tag" style="background: #ffd700; color: #000;">ESCUDO</div>
      <div id="tagInvert" class="status-tag" style="background: #22c55e; color: #000;">CONTROLES INVERTIDOS</div>
      <div id="tagSlow" class="status-tag" style="background: #3b82f6; color: #fff;">CÂMERA LENTA</div>
      <div id="tagSpeed" class="status-tag" style="background: #a855f7; color: #fff;">HIPERVELOCIDADE</div>
    </div>

    <div id="overlay" class="overlay">
      <h2 id="overlayTitle">PRONTO?</h2>
      <p id="overlayMessage">Cuidado com as bolinhas verdes, roxas e multicoloridas!</p>
      <button id="startBtn" class="btn">JOGAR</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayMessage = document.getElementById('overlayMessage');
    const startBtn = document.getElementById('startBtn');
    const scoreText = document.getElementById('scoreText');
    const hiScoreText = document.getElementById('hiScoreText');

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(type) {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'jump') {
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.12);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.12);
      } else if (type === 'good') {
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.2);
      } else if (type === 'bad') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(150, now + 0.25);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.25);
      } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.3);
      }
      osc.start(now);
      osc.stop(now + 0.25);
    }

    const GROUND_Y = 240;
    let gameRunning = false;
    let gameSpeed = 6;
    let score = 0;
    let highScore = localStorage.getItem('cyber_runner_hi') || 0;
    let frameCount = 0;

    hiScoreText.innerText = String(highScore).padStart(5, '0');
    const rawKeys = { jump: false, duck: false };

    const player = {
      x: 80, y: GROUND_Y - 50,
      width: 32, height: 50,
      normalHeight: 50, duckHeight: 26,
      vy: 0, gravity: 0.8, jumpForce: -13,
      isGrounded: false, isDucking: false,
      
      // Efeitos ativos (em frames)
      shieldTime: 0,
      invertTime: 0,
      slowTime: 0,
      speedTime: 0,

      reset() {
        this.y = GROUND_Y - this.normalHeight;
        this.height = this.normalHeight;
        this.vy = 0;
        this.isGrounded = true;
        this.isDucking = false;
        this.shieldTime = 0;
        this.invertTime = 0;
        this.slowTime = 0;
        this.speedTime = 0;
      },

      update() {
        // Aplicação do efeito de Inversão de Controles
        const wantJump = this.invertTime > 0 ? rawKeys.duck : rawKeys.jump;
        const wantDuck = this.invertTime > 0 ? rawKeys.jump : rawKeys.duck;

        // Agachar
        if (wantDuck && this.isGrounded) {
          if (!this.isDucking) {
            this.isDucking = true;
            this.height = this.duckHeight;
            this.y = GROUND_Y - this.duckHeight;
          }
        } else if (this.isDucking) {
          this.isDucking = false;
          this.height = this.normalHeight;
          this.y = GROUND_Y - this.normalHeight;
        }

        // Pular
        if (wantJump && this.isGrounded && !this.isDucking) {
          this.vy = this.jumpForce;
          this.isGrounded = false;
          playSound('jump');
        }

        this.vy += this.gravity;
        this.y += this.vy;

        if (this.y + this.height >= GROUND_Y) {
          this.y = GROUND_Y - this.height;
          this.vy = 0;
          this.isGrounded = true;
        }

        // Decrementar timers dos poderes
        if (this.shieldTime > 0) this.shieldTime--;
        if (this.invertTime > 0) this.invertTime--;
        if (this.slowTime > 0) this.slowTime--;
        if (this.speedTime > 0) this.speedTime--;

        // Atualizar Tags Visuais
        document.getElementById('tagShield').style.display = this.shieldTime > 0 ? 'block' : 'none';
        document.getElementById('tagInvert').style.display = this.invertTime > 0 ? 'block' : 'none';
        document.getElementById('tagSlow').style.display = this.slowTime > 0 ? 'block' : 'none';
        document.getElementById('tagSpeed').style.display = this.speedTime > 0 ? 'block' : 'none';
      },

      draw() {
        ctx.save();
        let glowColor = '#00f3ff';
        if (this.shieldTime > 0) glowColor = '#ffd700';
        else if (this.invertTime > 0) glowColor = '#22c55e';
        else if (this.speedTime > 0) glowColor = '#a855f7';

        ctx.shadowBlur = 12;
        ctx.shadowColor = glowColor;
        ctx.fillStyle = glowColor;
        ctx.fillRect(this.x, this.y, this.width, this.height);

        ctx.fillStyle = '#080b10';
        ctx.fillRect(this.x + 18, this.y + (this.isDucking ? 6 : 10), 10, 6);
        ctx.restore();
      }
    };

    let obstacles = [];
    let powerups = [];

    function applyEffect(type) {
      const effects = ['shield', 'invert', 'slow', 'speed'];
      let selectedEffect = type === 'random' ? effects[Math.floor(Math.random() * effects.length)] : type;

      if (selectedEffect === 'shield') {
        player.shieldTime = 300; // Amarela (Bom)
        playSound('good');
      } else if (selectedEffect === 'invert') {
        player.invertTime = 240; // Verde (Ruim)
        playSound('bad');
      } else if (selectedEffect === 'slow') {
        player.slowTime = 240;   // Azul (Bom: Câmera Lenta)
        player.speedTime = 0;
        playSound('good');
      } else if (selectedEffect === 'speed') {
        player.speedTime = 240;  // Roxa (Ruim: Aceleração)
        player.slowTime = 0;
        playSound('bad');
      }
    }

    function spawnEntities() {
      if (frameCount % Math.max(40, Math.floor(90 - gameSpeed * 2)) === 0) {
        if (Math.random() < 0.7) {
          const isFlying = Math.random() < 0.35 && score > 150;
          obstacles.push({
            x: canvas.width,
            y: isFlying ? GROUND_Y - 75 : GROUND_Y - 45,
            width: isFlying ? 35 : 25,
            height: isFlying ? 25 : 45,
            color: isFlying ? '#d946ef' : '#f43f5e'
          });
        } else {
          // Tipos: shield (amarela), invert (verde), slow (azul), speed (roxa), random (rainbow)
          const types = ['shield', 'invert', 'slow', 'speed', 'random'];
          const chosenType = types[Math.floor(Math.random() * types.length)];
          powerups.push({
            x: canvas.width,
            y: GROUND_Y - (Math.random() < 0.5 ? 40 : 85),
            size: 22,
            type: chosenType
          });
        }
      }
    }

    function startGame() {
      player.reset();
      obstacles = [];
      powerups = [];
      score = 0;
      gameSpeed = 6;
      frameCount = 0;
      gameRunning = true;
      overlay.style.display = 'none';
      requestAnimationFrame(gameLoop);
    }

    function gameOver() {
      gameRunning = false;
      playSound('hit');

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('cyber_runner_hi', highScore);
        hiScoreText.innerText = String(highScore).padStart(5, '0');
      }

      overlayTitle.innerText = "GAME OVER";
      overlayMessage.innerText = `Pontuação Final: ${score}`;
      startBtn.innerText = "JOGAR NOVAMENTE";
      overlay.style.display = 'block';
    }

    function gameLoop() {
      if (!gameRunning) return;

      frameCount++;
      score++;
      if (frameCount % 300 === 0) gameSpeed += 0.4;

      // Calcular velocidade atual considerando os efeitos
      let currentSpeed = gameSpeed;
      if (player.slowTime > 0) currentSpeed *= 0.5;
      if (player.speedTime > 0) currentSpeed *= 1.6;

      scoreText.innerText = String(score).padStart(5, '0');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Chão
      ctx.strokeStyle = '#334155';
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(canvas.width, GROUND_Y);
      ctx.stroke();

      player.update();
      player.draw();
      spawnEntities();

      // Obstáculos
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= currentSpeed;

        ctx.fillStyle = obs.color;
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

        if (
          player.x < obs.x + obs.width &&
          player.x + player.width > obs.x &&
          player.y < obs.y + obs.height &&
          player.y + player.height > obs.y
        ) {
          if (player.shieldTime > 0) {
            obstacles.splice(i, 1);
            playSound('hit');
          } else {
            gameOver();
            return;
          }
        }

        if (obs.x + obs.width < 0) obstacles.splice(i, 1);
      }

      // Power-ups
      for (let i = powerups.length - 1; i >= 0; i--) {
        let p = powerups[i];
        p.x -= currentSpeed;

        ctx.save();
        if (p.type === 'shield') ctx.fillStyle = '#ffd700';       // Amarela
        else if (p.type === 'invert') ctx.fillStyle = '#22c55e';   // Verde
        else if (p.type === 'slow') ctx.fillStyle = '#3b82f6';     // Azul
        else if (p.type === 'speed') ctx.fillStyle = '#a855f7';    // Roxa
        else if (p.type === 'random') {
          ctx.fillStyle = `hsl(${(frameCount * 12) % 360}, 100%, 60%)`; // Multicolorida
        }

        ctx.shadowBlur = 10;
        ctx.shadowColor = ctx.fillStyle;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (
          player.x < p.x + p.size &&
          player.x + player.width > p.x &&
          player.y < p.y + p.size &&
          player.y + player.height > p.y
        ) {
          applyEffect(p.type);
          powerups.splice(i, 1);
          continue;
        }

        if (p.x + p.size < 0) powerups.splice(i, 1);
      }

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', (e) => {
      if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) rawKeys.jump = true;
      if (['ArrowDown', 'KeyS'].includes(e.code)) rawKeys.duck = true;
    });

    window.addEventListener('keyup', (e) => {
      if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) rawKeys.jump = false;
      if (['ArrowDown', 'KeyS'].includes(e.code)) rawKeys.duck = false;
    });

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
