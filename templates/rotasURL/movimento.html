<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimentação - SENAI Almoxarifado</title>
    <link rel="stylesheet" href="../../static/style.css">
</head>
<body>

    <header>
        <div class="header-left">
            <span class="menu-hamburguer">&#9776;</span>
            <a href="/home" class="logo">SENAI <span>Almoxarifado</span></a>
        </div>
        <div class="user-avatar">&#128100;</div>
    </header>

    <nav class="top-nav">
        <a href="/home">Estoque</a>
        <a href="/movimento" class="active">Movimentação</a>
        <a href="/admin">Gerenciamento</a>
        <a href="/login">Cadastrar Usuário</a>
    </nav>

    <main>
        <h1 class="page-title">Movimentação de estoque</h1>
        <p class="page-subtitle">Registre entradas, saídas e alterações nos itens do estoque</p>

        <form action="#" method="POST" class="grid-2">
            <div class="card-painel">
                <div class="campo-form">
                    <label>Item</label>
                    <input type="text" name="item" class="input-padrao">
                </div>

                <div class="campo-form">
                    <label>Categoria:</label>
                    <input type="text" name="categoria" class="input-padrao">
                </div>
                
                <div class="campo-form">
                    <label>Descrição</label>
                    <textarea name="descricao" class="input-padrao" style="height: 110px; padding: 12px; resize: none;"></textarea>
                </div>
            </div>

            <div class="card-painel">
                <div class="campo-form">
                    <label>Tipo de movimentação:</label>
                    <div class="botoes-grupo">
                        <button type="button" class="botao-filtro" style="flex:1;">Entrada</button>
                        <button type="button" class="botao-filtro" style="flex:1;">Saída</button>
                        <button type="button" class="botao-filtro" style="flex:1;">Ajuste</button>
                    </div>
                </div>

                <div class="campo-form">
                    <label>Quantidade</label>
                    <input type="number" name="quantidade" class="input-padrao">
                </div>

                <div class="campo-form">
                    <label>Preço (R$)</label>
                    <input type="text" name="preco" class="input-padrao">
                </div>

                <div style="display: flex; justify-content: space-between; margin-top: 20px;">
                    <a href="/home" class="botao-menu" style="margin:0; background: #888;">Cancelar</a>
                    <button type="submit" class="botao-filtro" style="height: 50px;">Confirmar</button>
                </div>
            </div>
        </form>
    </main>

</body>
</html>
